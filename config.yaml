# =====================================================================
#  Config de la veille de stages. Tu peux tout modifier ici sans toucher
#  au code. Les mots-clés sont insensibles aux majuscules et aux accents.
#  Un terme matche les mots qui COMMENCENT par lui ("liquidit" trouve
#  "liquidité"). Ajoute "!" à la fin pour exiger le mot entier.
# =====================================================================

# ---------- LinkedIn (source principale) ----------
linkedin:
  # Recherches lancées à chaque passage (mot-clé x lieu).
  # Garde la liste courte : trop de requêtes = LinkedIn te bloque.
  # Mettre "stage" / "intern" dans la recherche aide LinkedIn à ramener
  # des stages de toutes les tailles d'entreprise, pas que des CDI
  keywords:
    - stage risque
    - risk intern
    - stage middle office
    - stage back office
    - stage ALM
    - stage finance de marché
  locations:
    - "Paris, Île-de-France, France"
    - "Luxembourg"
    - "Monaco"
  # Nombre de recherches par passage (à tour de rôle). Plus = plus de
  # risque que LinkedIn bloque. 3 toutes les 10 min = tout couvert en 1 h.
  queries_per_run: 3
  # Uniquement les offres publiées dans les X dernières heures
  max_age_hours: 24

# ---------- Sites carrières du groupe Crédit Agricole ----------
# Flux RSS des 20 dernières offres publiées sur le site carrières.
# Seuls les intitulés contenant "stage", "intern", "trainee"... sont gardés.
talentsoft:
  sites:
    - name: "Amundi"
      host: "jobs.amundi.com"
    - name: "CACEIS"
      host: "jobs.caceis.com"
    - name: "Indosuez Wealth Management"
      host: "jobs.ca-indosuez.com"

# ---------- Sites carrières Workday (optionnel) ----------
# Beaucoup de banques utilisent Workday : l'URL de leur page carrières
# ressemble à https://NOM.wd3.myworkdayjobs.com/NomDuSite
# Copie-colle cette URL ici (sans le /job/... à la fin).
workday:
  search_terms: ["intern", "stage", "internship"]
  sites: []
  #  - name: "Exemple Banque"
  #    url: "https://exemple.wd3.myworkdayjobs.com/Careers"

# ---------- Sites carrières SmartRecruiters (optionnel) ----------
# URL du type https://jobs.smartrecruiters.com/NomEntreprise -> mets NomEntreprise
smartrecruiters:
  search_terms: ["intern", "stage"]
  companies: []
  #  - name: "Exemple"
  #    id: "Exemple"

# ---------- Filtres sur l'intitulé ----------
filters:
  # L'intitulé doit contenir AU MOINS UN de ces termes
  include:
    - risk
    - risque
    - middle office
    - back office
    - alm
    - liquidit
    - contrepartie
    - counterparty
    - market!          # le "!" = mot entier (évite "marketing")
    - markets
    - marches
    - marche!
    - valuation
    - valorisation
    - derivative
    - derive
    - collateral
    - fund admin
    - fund accounting
    - investment restriction
    - investment compliance
    - wealth planning
    - ingenierie patrimoniale
    - patrimoin
    - private bank
    - banque privee
    - treasury
    - tresorerie
    - asset management
    - gestion d'actifs
    - portfolio
    - quant
    - securities
    - titres
  # L'intitulé ne doit contenir AUCUN de ces termes
  exclude:
    - alternance
    - alternant
    - apprenti
    - apprentissage
    - work-study
    - work study
    - apprenticeship
    - cdi
    - cdd
    - conseiller
    - charge de clientele
    - chargee de clientele
    - attache commercial
    - agence
    - business develop
    - credit consommation
    - particuliers
    - stage de 2 mois
    - stage de 3 mois
    - summer
    - alimentaire
    - qhse
    - hse!
    - sante
    - environnement
    - industriel
    - supply chain
    - achats
  # Postes expérimentés à éliminer (même si "stage" apparaît quelque part)
  seniority:
    - senior
    - manager
    - head
    - director
    - directeur
    - directrice
    - responsable
    - chef
    - cheffe
    - lead
    - confirme
    - experimente
    - expert
    - vp!
    - vice president
    - principal
  # Termes qui donnent le badge 🔥 (ton cœur de cible)
  priority:
    - market risk
    - risque de marche
    - counterparty
    - contrepartie
    - liquidity
    - liquidite
    - alm
    - risk analyst
    - analyste risque
    - risk governance
    - risk management
    - gestion des risques
    - valuation
    - investment restriction

# L'intitulé doit contenir un de ces termes (sinon ce n'est pas un stage)
internship_terms: ["stage", "stagiaire", "intern", "internship", "trainee", "off-cycle"]
# Pour les sites carrières hors LinkedIn : lieux acceptés (si le lieu est connu)
allowed_locations: ["paris", "ile-de-france", "la defense", "puteaux", "montrouge", "courbevoie", "nanterre", "neuilly", "saint-denis", "france", "luxembourg", "monaco"]
