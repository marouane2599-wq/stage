name: Veille stages

on:
  schedule:
    # Toutes les 10 min de 6h à 23h (heure de Paris en hiver). Horaires en UTC.
    # GitHub peut retarder les passages de quelques minutes aux heures chargées.
    - cron: "*/10 5-22 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer juste un message test sur Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python bot.py --test
          else
            python bot.py
          fi

      - name: Sauvegarder les offres déjà vues
        if: ${{ inputs.test != true }}
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || (git commit -m "maj offres vues" && git push)
